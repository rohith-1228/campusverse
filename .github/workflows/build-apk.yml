name: Build & Release Android APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.github/workflows/deploy.yml'
      - 'web/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      publish_release:
        description: 'Publish/Update GitHub Release with direct APK download'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Android APK
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          if [ "$BUILD_TYPE" = "debug" ]; then
            flutter build apk --debug
            cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/CampusVerse-debug.apk
          else
            flutter build apk --release
            cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/CampusVerse-release.apk
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CampusVerse-APK
          path: build/app/outputs/flutter-apk/CampusVerse-*.apk
          retention-days: 30

      - name: Publish Direct-Download GitHub Release
        if: ${{ github.event_name == 'push' || github.event.inputs.publish_release == true || github.event.inputs.publish_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: CampusVerse Android APK (Latest)
          body: |
            ## 📱 CampusVerse Android APK
            
            - **Build Date**: ${{ github.event.head_commit.timestamp || 'Manual Trigger' }}
            - **Commit**: ${{ github.sha }}
            - **Branch**: `${{ github.ref_name }}`
            
            ### ⬇️ Download & Install
            1. Download the `CampusVerse-release.apk` asset below directly onto your Android device.
            2. Tap the downloaded file to install (allow installation from unknown sources if prompted).
          files: build/app/outputs/flutter-apk/CampusVerse-*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
